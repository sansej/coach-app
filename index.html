<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренеры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
.top{display:flex;gap:6px;overflow-x:auto;padding:8px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{padding:7px 12px;border-radius:16px;background:var(--sec);white-space:nowrap;border:0;color:var(--tx);font-size:14px}.tab.on{background:var(--btn);color:var(--btx)}
.pad{padding:10px 12px}.row{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--sec)}.row.click{cursor:pointer}
.grow{flex:1}.hint{color:var(--hint);font-size:13px}h2{margin:6px 0;font-size:18px}h3{margin:14px 0 6px;font-size:16px}
button.b{background:var(--btn);color:var(--btx);border:0;border-radius:10px;padding:10px 14px;font-size:15px}button.b.s{background:var(--sec);color:var(--tx)}button.b.on{outline:2px solid var(--btn)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}.mh button{font-size:20px;background:none;border:0;color:var(--btn)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 4px}.dw{text-align:center;font-size:12px;color:var(--hint)}
.cell{min-height:64px;border-radius:8px;background:var(--sec);padding:3px;font-size:12px;overflow:hidden}.cell.today{outline:2px solid var(--btn)}.cell.e{background:none}
.chip{display:block;color:#fff;border-radius:6px;padding:1px 4px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip.x{text-decoration:line-through;opacity:.7}
.dot{display:inline-block;width:20px;height:20px;border-radius:10px;color:#fff;text-align:center;line-height:20px;font-size:11px}
input[type=checkbox]{width:24px;height:24px}textarea{width:100%;min-height:55vh;padding:10px;font:16px inherit;border-radius:10px;border:1px solid var(--sec);background:var(--bg);color:var(--tx)}
.plan{white-space:pre-wrap;user-select:text;-webkit-user-select:text;padding:12px}.err{color:#d33;padding:16px}.loading{padding:30px;text-align:center;color:var(--hint)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--sec);text-align:left}
</style></head><body><div id="app"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyfzJ0-sl6v1zuicVOS60hIKOpeItTAlC08HpVHEWj4C-90bzbJQFfF-LGA4oUJ5mzt/exec';
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const app = document.getElementById('app');
const ST = { user: null, coaches: [], today: '', ym: '', tab: 'cal', stack: [] };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const p2 = n => ('0' + n).slice(-2);
const dmy = s => s.split('-').reverse().join('.');
const dowOf = s => new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10), 12).getDay();
const shiftYm = (ym, n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); };
const coach = id => ST.coaches.find(c => c.id === id) || { name: '?', color: '#888' };
const isAdmin = () => ST.user.role === 'admin';
const isRun = () => ST.user.dir === 'run';

async function call(action, args) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, args: args || {}, initData: tg.initData }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
}
const h = (t, a, ...c) => { const e = document.createElement(t);
  for (const k in a || {}) { if (k === 'class') e.className = a[k]; else if (k === 'style') e.style.cssText = a[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), a[k]); else e[k] = a[k]; }
  c.flat(9).forEach(x => { if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); }); return e; };
const btn = (txt, fn, cls) => h('button', { class: 'b ' + (cls || ''), onclick: fn }, txt);
const toast = m => tg.showAlert ? tg.showAlert(m) : alert(m);

function go(fn) { ST.stack.push(fn); render(); }
function back() { if (ST.stack.length > 1) { ST.stack.pop(); render(); } }
function setTab(t) { ST.tab = t; ST.stack = [SCREENS[t]]; render(); }
function render() {
  const fn = ST.stack[ST.stack.length - 1];
  app.replaceChildren(h('div', { class: 'loading' }, 'Загрузка…'));
  fn().then(el => { app.replaceChildren(...[].concat(el)); })
    .catch(e => app.replaceChildren(h('div', { class: 'err' }, e.message), h('div', { class: 'pad' }, btn('Повторить', render))));
  ST.stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
}
tg.BackButton.onClick(back);

function tabs() {
  const t = [['cal', 'Календарь'], ['event', 'Event']];
  if (isRun() || isAdmin()) t.splice(1, 0, ['avail', 'Доступность']);
  if (isAdmin()) t.push(['sched', 'График'], ['report', 'Отчёт']);
  return h('div', { class: 'top' }, t.map(x => h('button', { class: 'tab' + (ST.tab === x[0] ? ' on' : ''), onclick: () => setTab(x[0]) }, x[1])));
}
const withTabs = (...els) => [tabs(), ...els];
function monthHeader(onChange) {
  const [y, m] = ST.ym.split('-').map(Number);
  return h('div', { class: 'mh' }, h('button', { onclick: () => { ST.ym = shiftYm(ST.ym, -1); onChange(); } }, '‹'),
    h('b', {}, MONTHS[m - 1] + ' ' + y), h('button', { onclick: () => { ST.ym = shiftYm(ST.ym, 1); onChange(); } }, '›'));
}

/* ---------- календарь ---------- */
async function calendar() {
  const d = await call('month', { ym: ST.ym }), [y, m] = ST.ym.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate(), cells = [];
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x => cells.push(h('div', { class: 'dw' }, x)));
  for (let i = 0; i < offset; i++) cells.push(h('div', { class: 'cell e' }));
  for (let n = 1; n <= dim; n++) {
    const date = ST.ym + '-' + p2(n), info = d.days[date];
    cells.push(h('div', { class: 'cell' + (date === ST.today ? ' today' : ''), onclick: () => go(() => dayScreen(date)) },
      n + (info && info.plan ? ' 📄' : ''),
      info ? info.ids.map(id => h('span', { class: 'chip' + (info.cancelled ? ' x' : ''), style: 'background:' + coach(id).color },
        (info.hosted.indexOf(id) >= 0 ? '✓ ' : '') + coach(id).name)) : null));
  }
  return withTabs(monthHeader(() => render()), h('div', { class: 'grid' }, cells));
}

async function dayScreen(date) {
  const d = await call('day', { ym: ST.ym, date }), out = [h('div', { class: 'pad' }, h('h2', {}, DOW[dowOf(date)] + ' ' + dmy(date)))];
  if (!d.sessions.length) out.push(h('div', { class: 'pad hint' }, 'В этот день тренировок нет.'));
  d.sessions.forEach(s => {
    out.push(h('h3', { class: 'pad' }, s.title + (s.cancelled ? ' · отменена' : '')));
    if (s.type === 'run') {
      s.ids.forEach(id => out.push(h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + coach(id).color }, coach(id).name[0]), h('span', { class: 'grow' }, coach(id).name),
        hostedBox(date, id, s.hosted.indexOf(id) >= 0))));
      if (!s.ids.length) out.push(h('div', { class: 'pad hint' }, 'Тренеры не назначены'));
      if (isRun() || isAdmin()) {   // отметить проведение за любого беговго тренера
        const others = ST.coaches.filter(c => s.ids.indexOf(c.id) < 0);
        if (others.length) out.push(h('div', { class: 'pad hint' }, 'Провёл вместо назначенного:'), ...others.map(c =>
          h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + c.color }, c.name[0]), h('span', { class: 'grow' }, c.name), hostedBox(date, c.id, s.hosted.indexOf(c.id) >= 0))));
      }
      if (s.plan || isAdmin()) out.push(h('div', { class: 'pad' }, btn(s.plan ? '📄 План тренировки' : '➕ Составить план', () => go(() => planScreen(date)), 's')));
      if (isAdmin()) out.push(h('div', { class: 'pad' }, btn(s.cancelled ? 'Вернуть тренировку' : 'Отменить тренировку', async () => {
        try { await call('cancelPublished', { date, value: !s.cancelled }); render(); } catch (e) { toast(e.message); } }, 's')));
    }
    out.push(h('div', { class: 'pad' }, s.open ? btn('👥 Список участников', () => go(() => listScreen({ type: s.type, date, title: s.title + ' · ' + dmy(date) }))) : h('span', { class: 'hint' }, 'Список откроется позже (бег — с понедельника, йога/функционал — с пятницы)')));
  });
  return out;
}
function hostedBox(date, id, val) {
  return h('input', { type: 'checkbox', checked: val, onchange: async ev => {
    try { await call('toggleHosted', { date, coachId: id, value: ev.target.checked }); } catch (e) { ev.target.checked = !ev.target.checked; toast(e.message); } } });
}

/* ---------- список и карточка ---------- */
async function listScreen(o) {
  const d = await call('list', { type: o.type, date: o.date, iid: o.iid });
  const out = [h('div', { class: 'pad' }, h('h2', {}, o.title), h('div', { class: 'hint' }, 'Участников: ' + d.items.length + (d.cancelled ? ' · тренировка отменена' : '')))];
  d.items.forEach((p, i) => out.push(h('div', { class: 'row' },
    h('span', { class: 'hint', style: 'width:26px' }, i + 1),
    h('span', { class: 'grow click', onclick: () => go(() => cardScreen(p.pid)) }, (p.surname + ' ' + p.name).trim()),
    h('input', { type: 'checkbox', checked: p.visited, disabled: !d.canMark, onchange: async ev => {
      try { await call('setVisit', { type: o.type, date: o.date, iid: o.iid, pid: p.pid, value: ev.target.checked }); }
      catch (e) { ev.target.checked = !ev.target.checked; toast(e.message); } } }))));
  if (!d.items.length) out.push(h('div', { class: 'pad hint' }, 'Пока никто не зарегистрировался.'));
  return out;
}

async function cardScreen(pid) {
  const c = await call('card', { pid }), L = { run: 'Бег', yoga: 'Йога', func: 'Функционал', event: 'Event', total: 'Итого' };
  const cell = b => b.v + ' · ' + b.p + '%';
  return [h('div', { class: 'pad' }, h('h2', {}, (c.surname + ' ' + c.name).trim()),
    c.phone ? h('div', {}, '📞 ' + c.phone) : null, c.email ? h('div', {}, '✉️ ' + c.email) : null,
    h('div', { class: 'hint' }, 'Первая регистрация: ' + c.first),
    h('h3', {}, 'Посещения (кол-во · %)'),
    h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Месяц'), h('th', {}, 'Год'), h('th', {}, 'Всё время')),
      Object.keys(L).map(k => h('tr', {}, h('td', {}, L[k]), h('td', {}, cell(c.stats[k].m)), h('td', {}, cell(c.stats[k].y)), h('td', {}, cell(c.stats[k].a))))))];
}

/* ---------- план ---------- */
async function planScreen(date) {
  const d = await call('getPlan', { date }), head = h('div', { class: 'pad' }, h('h2', {}, 'План · ' + DOW[dowOf(date)] + ' ' + dmy(date)));
  if (!d.canEdit) return [head, h('div', { class: 'plan' }, d.text || 'План ещё не составлен.')];
  let timer = null, last = d.text;
  const ta = h('textarea', { value: d.text, placeholder: 'Опишите тренировку: разминка, основная часть, заминка…' }), st = h('div', { class: 'hint' }, '');
  const save = async () => { if (ta.value === last) return; try { st.textContent = 'Сохранение…'; await call('savePlan', { date, text: ta.value }); last = ta.value; st.textContent = 'Сохранено'; } catch (e) { st.textContent = 'Ошибка: ' + e.message; } };
  ta.addEventListener('input', () => { st.textContent = ''; clearTimeout(timer); timer = setTimeout(save, 1000); });
  ta.addEventListener('blur', save);
  return [head, h('div', { class: 'pad' }, ta, st, h('div', { class: 'hint' }, 'Очистите поле, чтобы удалить план.'))];
}

/* ---------- Event ---------- */
async function eventsScreen() {
  const d = await call('events');
  return withTabs(h('div', { class: 'pad' }, h('h2', {}, 'Мероприятия')), ...d.events.map(e => h('div', { class: 'row click', onclick: () => go(() => listScreen({ type: 'event', iid: e.iid, title: e.name + ' · ' + dmy(e.date) })) },
    h('span', { class: 'grow' }, e.name), h('span', { class: 'hint' }, dmy(e.date) + ' · ' + e.count))),
    d.events.length ? null : h('div', { class: 'pad hint' }, 'Регистраций нет.'));
}

/* ---------- доступность ---------- */
async function availScreen() {
  const d = await call('availGet', { ym: ST.ym }), out = [monthHeader(() => render())];
  d.coaches.forEach(c => {
    out.push(h('h3', { class: 'pad' }, c.name + ' · ответов ' + c.answered + '/' + c.total));
    d.dates.forEach(x => {
      const set = async s => { try { await call('availSet', { coachId: c.id, items: [{ date: x.date, status: s }] }); render(); } catch (e) { toast(e.message); } };
      const cur = c.status[x.date], pend = c.pending[x.date];
      out.push(h('div', { class: 'row' }, h('span', { class: 'grow' }, DOW[dowOf(x.date)] + ' ' + dmy(x.date) + (x.published ? ' 🔒' : '')),
        x.past ? h('span', { class: 'hint' }, cur === 'can' ? 'мог' : cur === 'cannot' ? 'не мог' : '—') : [
          btn('Могу', () => set('can'), 's' + ((pend || cur) === 'can' ? ' on' : '')), btn('Не могу', () => set('cannot'), 's' + ((pend || cur) === 'cannot' ? ' on' : ''))],
        pend ? h('span', { class: 'hint' }, '⏳') : null));
    });
    out.push(h('div', { class: 'pad' }, btn('Могу все даты месяца', async () => { try { await call('availSet', { coachId: c.id, items: d.dates.map(x => ({ date: x.date, status: 'can' })) }); render(); } catch (e) { toast(e.message); } }, 's')));
  });
  out.push(h('div', { class: 'pad hint' }, '🔒 — график месяца уже опубликован, изменение уйдёт администратору на утверждение (⏳).'));
  return withTabs(...out);
}

/* ---------- график (админ) ---------- */
async function schedScreen() {
  const d = await call('draftGet', { ym: ST.ym }), out = [monthHeader(() => render())];
  const run = async (action, msg) => { try { const r = await call(action, { ym: ST.ym }); if (r && r.warnings && r.warnings.length) toast(r.warnings.join('\n')); if (r && r.uncovered) toast('Без тренеров: ' + r.uncovered + ' дат(ы)'); render(); } catch (e) { toast(e.message); } };
  if (d.missing.length) out.push(h('div', { class: 'pad' }, h('b', {}, '⚠️ Не заполнили доступность: '), d.missing.join(', ')));
  d.pending.forEach(p => out.push(h('div', { class: 'row' }, h('span', { class: 'grow' }, coach(p.id).name + ' · ' + dmy(p.date) + ': ' + (p.from || '—') + ' → ' + p.to),
    btn('✓', async () => { await call('availResolve', { date: p.date, id: p.id, approve: true }); render(); }, 's'), btn('✕', async () => { await call('availResolve', { date: p.date, id: p.id, approve: false }); render(); }, 's'))));
  out.push(h('div', { class: 'pad', style: 'display:flex;gap:8px;flex-wrap:wrap' }, btn('Сгенерировать', () => run('draftGenerate')), btn('Из опубликованного', () => run('draftFromPublished'), 's'), btn('Опубликовать', () => run('publish'))));
  if (!d.exists) out.push(h('div', { class: 'pad hint' }, 'Проекта на этот месяц нет.'));
  d.dates.forEach(x => out.push(h('div', { class: 'row click', onclick: () => go(() => editDraft(x)) }, h('span', { class: 'grow' }, DOW[dowOf(x.date)] + ' ' + dmy(x.date)),
    x.cancelled ? h('span', { class: 'hint' }, 'отмена') : x.ids.map(id => h('span', { class: 'chip', style: 'background:' + coach(id).color }, coach(id).name)))));
  out.push(h('div', { class: 'pad hint' }, 'Нагрузка в проекте: ' + ST.coaches.map(c => c.name + ' ' + (d.load[c.id] || 0)).join(' · ')));
  return withTabs(...out);
}
async function editDraft(x) {
  let sel = new Set(x.ids), canc = x.cancelled;
  const boxes = ST.coaches.map(c => h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + c.color }, c.name[0]), h('span', { class: 'grow' }, c.name),
    h('input', { type: 'checkbox', checked: sel.has(c.id), onchange: ev => { if (ev.target.checked) sel.add(c.id); else sel.delete(c.id); } })));
  return [h('div', { class: 'pad' }, h('h2', {}, DOW[dowOf(x.date)] + ' ' + dmy(x.date)), h('div', { class: 'hint' }, 'От 1 до 3 тренеров')), ...boxes,
    h('div', { class: 'row' }, h('span', { class: 'grow' }, 'Тренировка отменена'), h('input', { type: 'checkbox', checked: canc, onchange: ev => { canc = ev.target.checked; } })),
    h('div', { class: 'pad' }, btn('Сохранить в проект', async () => { try { await call('draftSet', { date: x.date, ids: [...sel], cancelled: canc }); back(); } catch (e) { toast(e.message); } }))];
}

/* ---------- отчёт ---------- */
async function reportScreen() {
  const d = await call('report', { ym: ST.ym });
  return withTabs(monthHeader(() => render()), h('div', { class: 'pad' }, h('table', {}, h('tr', {}, h('th', {}, 'Тренер'), h('th', {}, 'План'), h('th', {}, 'Факт'), h('th', {}, 'Год')),
    d.rows.map(r => h('tr', {}, h('td', {}, r.name), h('td', {}, r.plan), h('td', {}, r.fact), h('td', {}, r.year))))));
}

const SCREENS = { cal: calendar, avail: availScreen, event: eventsScreen, sched: schedScreen, report: reportScreen };
(async () => {
  try { const i = await call('init'); ST.user = i.user; ST.coaches = i.coaches; ST.today = i.today; ST.ym = i.today.slice(0, 7); setTab('cal'); }
  catch (e) { app.replaceChildren(h('div', { class: 'err' }, e.message)); }
})();
</script></body></html>
