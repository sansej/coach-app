<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренеры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#1e1e1e;
  --ink:#f3f3f0;
  --muted:#abaaa3;
  --lime:#bcef30;
  --lime-2:#cdf55a;
  --card:#2a2a2a;
  --line:#3b3b3b;
  --graphite:#373737;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 "Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding:0 0 calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:20px}
.brand{
  display:flex;align-items:center;gap:13px;padding:18px 18px 14px;
  background:var(--graphite);color:#f3f3f0;border-radius:0 0 24px 24px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.brand-mark{flex:0 0 auto;height:38px;width:auto;display:block}
.brand-title{font-size:17px;font-weight:900;letter-spacing:.055em;line-height:1.1}
.brand-sub{margin-top:4px;color:#c9cac0;font-size:10px;font-weight:650;letter-spacing:.16em}
.top{
  display:flex;gap:8px;overflow-x:auto;padding:15px 14px 12px;
  position:sticky;top:0;background:rgba(30,30,30,.94);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);z-index:5;scrollbar-width:none;
}
.top::-webkit-scrollbar{display:none}
.tab{
  padding:10px 15px;border-radius:999px;background:var(--card);white-space:nowrap;
  border:1px solid var(--line);color:#d6d6cf;font-size:13px;font-weight:700;
  box-shadow:none;transition:.18s ease;
}
.tab.on{background:var(--lime);color:#373737;border-color:var(--lime);box-shadow:none}
.pad{padding:10px 16px}
h2{margin:5px 0 10px;font-size:21px;line-height:1.2;font-weight:850;letter-spacing:-.035em}
h3{margin:17px 0 7px;padding:0 16px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:12px}
.row{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--card);min-height:52px;
}
.row:first-of-type{border-radius:14px 14px 0 0}
.row.click{cursor:pointer;transition:background .15s}
.row.click:active{background:#333}
.grow{flex:1;min-width:0}
button.b{
  background:var(--lime);color:#373737;border:0;border-radius:12px;
  padding:11px 16px;font-size:13px;font-weight:800;letter-spacing:.005em;
  box-shadow:none;transition:transform .15s,opacity .15s;
}
button.b:active{transform:scale(.98)}
button.b.s{background:#3a3a3a;color:var(--ink);box-shadow:none}
button.b.on{outline:2px solid var(--lime);outline-offset:2px}
.mh{
  display:flex;align-items:center;justify-content:space-between;
  margin:8px 14px 12px;padding:17px 18px;border-radius:20px;
  background:var(--lime);color:#373737;
  min-height:100px;position:relative;overflow:hidden;
}
.mh:after{
  content:"";position:absolute;width:190px;height:190px;border:24px solid rgba(255,255,255,.22);
  border-radius:50%;right:40px;top:-100px;pointer-events:none;
}
.mh b{font-size:22px;font-weight:900;letter-spacing:-.04em;position:relative;z-index:1}
.mh button{
  position:relative;z-index:1;width:42px;height:42px;border-radius:50%;margin-left:6px;
  background:#373737;border:0;color:var(--lime);font-size:25px;line-height:1;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 12px}
.dw{text-align:center;font-size:11px;color:var(--muted);font-weight:750;padding:7px 0 9px}
.cell{
  min-height:clamp(66px,17vw,96px);border-radius:12px;background:var(--card);
  border:1px solid var(--line);padding:5px 4px;font-size:11px;font-weight:750;
  overflow:hidden;box-shadow:none;cursor:pointer;
}
.cell.today{outline:2px solid var(--lime);outline-offset:-2px;background:#33381f}
.cell.e{background:transparent;border-color:transparent;box-shadow:none;cursor:default}
.chip{
  display:block;
  background:#3a3a3a;
  background:color-mix(in srgb,var(--coach-color,#bcef30) 34%,#2a2a2a);
  color:#f3f3f0;
  border:1px solid var(--coach-color,#bcef30);
  border-radius:7px;
  padding:4px 5px;
  margin-top:4px;
  font-size:10px;
  font-weight:400;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:none;
}
.chip.x{text-decoration:line-through;opacity:.65}
.dot{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 25px;
  width:25px;height:25px;border-radius:50%;color:#1e1e1e;font-weight:800;font-size:11px;
}
input[type=checkbox]{width:22px;height:22px;accent-color:#bcef30;cursor:pointer}
textarea{
  width:100%;min-height:55vh;padding:14px;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;
}
textarea:focus{border-color:#bcef30;box-shadow:0 0 0 3px rgba(188,239,48,.2)}
.plan{white-space:pre-wrap;user-select:text;-webkit-user-select:text;padding:16px;line-height:1.55}
.err{color:#ff8a84;padding:18px}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}
table{width:calc(100% - 28px);margin:8px 14px;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:14px;overflow:hidden;font-size:12px}
td,th{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:#333}
tr:last-child td{border-bottom:0}
#app>.pad:has(table){padding-left:0;padding-right:0}
#app>.pad:has(textarea){padding-top:6px}
@media(min-width:600px){
  .brand{border-radius:0 0 26px 26px;padding:20px 24px}
  .top{padding-left:20px;padding-right:20px}
  .grid{gap:7px;padding:0 18px}
  .cell{min-height:88px;padding:7px}
  .chip{font-size:11px;padding:4px 7px}
}
@media(max-width:370px){
  .brand{padding:15px 14px}
  .brand-title{font-size:15px}
  .tab{padding:9px 12px;font-size:12px}
  .grid{gap:3px;padding:0 7px}
  .cell{min-height:59px;border-radius:9px;padding:4px 3px}
  .chip{font-size:9px;padding:2px 4px}
}

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw3oIB47wzrUf9X_j2_OBEBO5JM60jD_5aJlyI8Mcgpv9eOWgSY9QS-A32Abp6X998H/exec';
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#373737'); tg.setBackgroundColor('#1e1e1e'); } catch (e) {}
const app = document.getElementById('app');
const ST = { user: null, coaches: [], today: '', ym: '', tab: 'cal', stack: [] };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const p2 = n => ('0' + n).slice(-2);
const dmy = s => s.split('-').reverse().join('.');
const dowOf = s => new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10), 12).getDay();
const shiftYm = (ym, n) => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 1 + n, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); };
const coach = id => ST.coaches.find(c => c.id === id) || { name: '?', color: '#888' };
const isAdmin = () => ST.user.role === 'admin';
const isRun = () => ST.user.dir === 'run';

async function call(action, args) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, args: args || {}, initData: tg.initData }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
}
const h = (t, a, ...c) => { const e = document.createElement(t);
  for (const k in a || {}) { if (k === 'class') e.className = a[k]; else if (k === 'style') e.style.cssText = a[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), a[k]); else e[k] = a[k]; }
  c.flat(9).forEach(x => { if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); }); return e; };
const btn = (txt, fn, cls) => h('button', { class: 'b ' + (cls || ''), onclick: fn }, txt);
const toast = m => tg.showAlert ? tg.showAlert(m) : alert(m);

function go(fn) { ST.stack.push(fn); render(); }
function back() { if (ST.stack.length > 1) { ST.stack.pop(); render(); } }
function setTab(t) { guard(() => { AV = null; ST.tab = t; ST.stack = [SCREENS[t]]; render(); }); }
function render() {
  const fn = ST.stack[ST.stack.length - 1];
  app.replaceChildren(h('div', { class: 'loading' }, 'Загрузка…'));
  fn().then(el => { app.replaceChildren(...[].concat(el)); })
    .catch(e => app.replaceChildren(h('div', { class: 'err' }, e.message), h('div', { class: 'pad' }, btn('Повторить', render))));
  ST.stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
}
tg.BackButton.onClick(back);

function tabs() {
  const t = [['cal', 'Календарь'], ['event', 'Event']];
  if (isRun() || isAdmin()) t.splice(1, 0, ['avail', 'Доступность']);
  if (isAdmin()) t.push(['sched', 'График'], ['report', 'Отчёт']);
  return h('div', { class: 'top' }, t.map(x => h('button', { class: 'tab' + (ST.tab === x[0] ? ' on' : ''), onclick: () => setTab(x[0]) }, x[1])));
}

const withTabs = (...els) => [brandHeader(), tabs(), ...els];
function monthHeader(onChange) {
  const [y, m] = ST.ym.split('-').map(Number);
  return h('div', { class: 'mh' }, h('button', { onclick: () => { ST.ym = shiftYm(ST.ym, -1); onChange(); } }, '‹'),
    h('b', {}, MONTHS[m - 1] + ' ' + y), h('button', { onclick: () => { ST.ym = shiftYm(ST.ym, 1); onChange(); } }, '›'));
}

/* ---------- календарь ---------- */
async function calendar() {
  const d = await call('month', { ym: ST.ym }), [y, m] = ST.ym.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate(), cells = [];
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x => cells.push(h('div', { class: 'dw' }, x)));
  for (let i = 0; i < offset; i++) cells.push(h('div', { class: 'cell e' }));
  for (let n = 1; n <= dim; n++) {
    const date = ST.ym + '-' + p2(n), info = d.days[date];
    cells.push(h('div', { class: 'cell' + (date === ST.today ? ' today' : ''), onclick: () => go(() => dayScreen(date)) },
      n + (info && info.plan ? ' 📄' : ''),
      info ? info.ids.map(id => h('span', {
  class: 'chip' + (info.cancelled ? ' x' : ''),
  style: '--coach-color:' + coach(id).color
},
  (info.hosted.indexOf(id) >= 0 ? '✓ ' : '') + coach(id).name
)) : null));
  }
  return withTabs(monthHeader(() => render()), h('div', { class: 'grid' }, cells));
}

async function dayScreen(date) {
  const d = await call('day', { ym: ST.ym, date }), out = [h('div', { class: 'pad' }, h('h2', {}, DOW[dowOf(date)] + ' ' + dmy(date)))];
  if (!d.sessions.length) out.push(h('div', { class: 'pad hint' }, 'В этот день тренировок нет.'));
  d.sessions.forEach(s => {
    out.push(h('h3', { class: 'pad' }, s.title + (s.cancelled ? ' · отменена' : '')));
    if (s.type === 'run') {
      s.ids.forEach(id => out.push(h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + coach(id).color }, coach(id).name[0]), h('span', { class: 'grow' }, coach(id).name),
        hostedBox(date, id, s.hosted.indexOf(id) >= 0))));
      if (!s.ids.length) out.push(h('div', { class: 'pad hint' }, 'Тренеры не назначены'));
      if (isRun() || isAdmin()) {   // отметить проведение за любого беговго тренера
        const others = ST.coaches.filter(c => s.ids.indexOf(c.id) < 0);
        if (others.length) out.push(h('div', { class: 'pad hint' }, 'Провёл вместо назначенного:'), ...others.map(c =>
          h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + c.color }, c.name[0]), h('span', { class: 'grow' }, c.name), hostedBox(date, c.id, s.hosted.indexOf(c.id) >= 0))));
      }
      if (s.plan || isAdmin()) out.push(h('div', { class: 'pad' }, btn(s.plan ? '📄 План тренировки' : '➕ Составить план', () => go(() => planScreen(date)), 's')));
      if (isAdmin()) out.push(h('div', { class: 'pad' }, btn(s.cancelled ? 'Вернуть тренировку' : 'Отменить тренировку', async () => {
        try { await call('cancelPublished', { date, value: !s.cancelled }); render(); } catch (e) { toast(e.message); } }, 's')));
    }
    out.push(h('div', { class: 'pad' }, s.open ? btn('👥 Список участников', () => go(() => listScreen({ type: s.type, date, title: s.title + ' · ' + dmy(date) }))) : h('span', { class: 'hint' }, 'Список откроется позже (бег — с понедельника, йога/функционал — с пятницы)')));
  });
  return out;
}
function hostedBox(date, id, val) {
  return h('input', { type: 'checkbox', checked: val, onchange: async ev => {
    try { await call('toggleHosted', { date, coachId: id, value: ev.target.checked }); } catch (e) { ev.target.checked = !ev.target.checked; toast(e.message); } } });
}

/* ---------- список и карточка ---------- */
/* ---------- копирование списка (для всех ролей) ---------- */
function copyBlock(title, items) {
  const text = title + ' · ' + items.length + '\n' + items.map((p, i) => (i + 1) + '. ' + (p.surname + ' ' + p.name).trim()).join('\n');
  const area = h('textarea', { readOnly: true, value: text, style: 'min-height:160px' });
  const fb = h('div', { style: 'display:none;margin-top:8px' }, h('div', { class: 'hint' }, 'Автоматически скопировать не вышло: выделите текст ниже и скопируйте его.'), area);
  const b = btn('📋 Копировать список', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) {
      try { const t = h('textarea', { value: text, style: 'position:fixed;top:0;left:0;opacity:0;min-height:0' }); document.body.append(t); t.focus(); t.select(); ok = document.execCommand('copy'); t.remove(); } catch (e2) {}
    }
    if (ok) { fb.style.display = 'none'; b.textContent = '✓ Скопировано'; setTimeout(() => { b.textContent = '📋 Копировать список'; }, 1500); }
    else { fb.style.display = 'block'; area.focus(); area.select(); }
  }, 's');
  return h('div', { class: 'pad' }, b, fb);
}

async function listScreen(o) {
  const d = await call('list', { type: o.type, date: o.date, iid: o.iid });
  const out = [h('div', { class: 'pad' }, h('h2', {}, o.title), h('div', { class: 'hint' }, 'Участников: ' + d.items.length + (d.cancelled ? ' · тренировка отменена' : '')))];
  if (d.items.length) out.push(copyBlock(o.title, d.items));
  d.items.forEach((p, i) => out.push(h('div', { class: 'row' },
    h('span', { class: 'hint', style: 'width:26px' }, i + 1),
    h('span', { class: 'grow click', onclick: () => go(() => cardScreen(p.pid)) }, (p.surname + ' ' + p.name).trim()),
    h('input', { type: 'checkbox', checked: p.visited, disabled: !d.canMark, onchange: async ev => {
      try { await call('setVisit', { type: o.type, date: o.date, iid: o.iid, pid: p.pid, value: ev.target.checked }); }
      catch (e) { ev.target.checked = !ev.target.checked; toast(e.message); } } }))));
  if (!d.items.length) out.push(h('div', { class: 'pad hint' }, 'Пока никто не зарегистрировался.'));
  return out;
}

async function cardScreen(pid) {
  const c = await call('card', { pid }), L = { run: 'Бег', yoga: 'Йога', func: 'Функционал', event: 'Event', total: 'Итого' };
  const cell = b => b.v + ' · ' + b.p + '%';
  return [h('div', { class: 'pad' }, h('h2', {}, (c.surname + ' ' + c.name).trim()),
    c.phone ? h('div', {}, '📞 ' + c.phone) : null, c.email ? h('div', {}, '✉️ ' + c.email) : null,
    h('div', { class: 'hint' }, 'Первая регистрация: ' + c.first),
    h('h3', {}, 'Посещения (кол-во · %)'),
    h('table', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Месяц'), h('th', {}, 'Год'), h('th', {}, 'Всё время')),
      Object.keys(L).map(k => h('tr', {}, h('td', {}, L[k]), h('td', {}, cell(c.stats[k].m)), h('td', {}, cell(c.stats[k].y)), h('td', {}, cell(c.stats[k].a))))))];
}

/* ---------- план ---------- */
async function planScreen(date) {
  const d = await call('getPlan', { date }), head = h('div', { class: 'pad' }, h('h2', {}, 'План · ' + DOW[dowOf(date)] + ' ' + dmy(date)));
  if (!d.canEdit) return [head, h('div', { class: 'plan' }, d.text || 'План ещё не составлен.')];
  let timer = null, last = d.text;
  const ta = h('textarea', { value: d.text, placeholder: 'Опишите тренировку: разминка, основная часть, заминка…' }), st = h('div', { class: 'hint' }, '');
  const save = async () => { if (ta.value === last) return; try { st.textContent = 'Сохранение…'; await call('savePlan', { date, text: ta.value }); last = ta.value; st.textContent = 'Сохранено'; } catch (e) { st.textContent = 'Ошибка: ' + e.message; } };
  ta.addEventListener('input', () => { st.textContent = ''; clearTimeout(timer); timer = setTimeout(save, 1000); });
  ta.addEventListener('blur', save);
  return [head, h('div', { class: 'pad' }, ta, st, h('div', { class: 'hint' }, 'Очистите поле, чтобы удалить план.'))];
}

/* ---------- Event ---------- */
async function eventsScreen() {
  const d = await call('events');
  return withTabs(h('div', { class: 'pad' }, h('h2', {}, 'Мероприятия')), ...d.events.map(e => h('div', { class: 'row click', onclick: () => go(() => listScreen({ type: 'event', iid: e.iid, title: e.name + ' · ' + dmy(e.date) })) },
    h('span', { class: 'grow' }, e.name), h('span', { class: 'hint' }, dmy(e.date) + ' · ' + e.count))),
    d.events.length ? null : h('div', { class: 'pad hint' }, 'Регистраций нет.'));
}

/* ---------- доступность ---------- */
// Изменения копятся в AV.draft и уходят на сервер только по кнопке «Сохранить».
let AV = null;   // { ym, data, draft: { coachId: { 'YYYY-MM-DD': 'can' | 'cannot' } } }
function avCount() { return AV ? Object.keys(AV.draft).reduce((n, c) => n + Object.keys(AV.draft[c]).length, 0) : 0; }
// Если есть несохранённые изменения, спрашиваем перед уходом с вкладки или месяца.
function guard(next) {
  if (!avCount()) return next();
  const msg = 'Есть несохранённые изменения доступности. Уйти без сохранения?';
  if (tg.showConfirm) tg.showConfirm(msg, ok => { if (ok) next(); });
  else if (confirm(msg)) next();
}
function avSet(coachId, dates, status) {
  const c = AV.data.coaches.find(x => x.id === coachId);
  const m = AV.draft[coachId] || (AV.draft[coachId] = {});
  dates.forEach(date => {
    const base = c.pending[date] || c.status[date];   // что сейчас на сервере (с учётом ожидающих утверждения)
    if (base === status) delete m[date]; else m[date] = status;
  });
  if (!Object.keys(m).length) delete AV.draft[coachId];
  paintAvail();
}
function paintAvail() { app.replaceChildren(...buildAvail(AV.data)); }
function availMonth(n) { guard(() => { AV = null; ST.ym = shiftYm(ST.ym, n); render(); }); }

function buildAvail(d) {
  const [y, m] = ST.ym.split('-').map(Number), out = [];
  out.push(h('div', { class: 'mh' }, h('button', { onclick: () => availMonth(-1) }, '‹'),
    h('b', {}, MONTHS[m - 1] + ' ' + y), h('button', { onclick: () => availMonth(1) }, '›')));
  d.coaches.forEach(c => {
    const mine = AV.draft[c.id] || {}, n = Object.keys(mine).length;
    out.push(h('h3', { class: 'pad' }, c.name + ' · ответов ' + c.answered + '/' + c.total + (n ? ' · не сохранено: ' + n : '')));
    d.dates.forEach(x => {
      const cur = c.status[x.date], pend = c.pending[x.date], eff = mine[x.date] || pend || cur;
      out.push(h('div', { class: 'row' }, h('span', { class: 'grow' }, DOW[dowOf(x.date)] + ' ' + dmy(x.date) + (x.published ? ' 🔒' : '')),
        x.past ? h('span', { class: 'hint' }, cur === 'can' ? 'мог' : cur === 'cannot' ? 'не мог' : '—') : [
          btn('Могу', () => avSet(c.id, [x.date], 'can'), 's' + (eff === 'can' ? ' on' : '')),
          btn('Не могу', () => avSet(c.id, [x.date], 'cannot'), 's' + (eff === 'cannot' ? ' on' : ''))],
        pend ? h('span', { class: 'hint' }, '⏳') : null));
    });
    const open = d.dates.filter(x => !x.past).map(x => x.date);   // прошедшие даты не меняем
    out.push(h('div', { class: 'pad', style: 'display:flex;gap:8px;flex-wrap:wrap' },
      btn('Могу весь месяц', () => avSet(c.id, open, 'can'), 's'),
      btn('Не могу весь месяц', () => avSet(c.id, open, 'cannot'), 's')));
  });
  out.push(h('div', { class: 'pad hint' }, '🔒 — график месяца уже опубликован, изменение уйдёт администратору на утверждение (⏳).'));
  out.push(h('div', { style: 'height:72px' }));   // место под панель «Сохранить»
  const n = avCount();
  out.push(h('div', { style: 'position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:rgba(30,30,30,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:6' },
    h('span', { class: 'hint grow' }, n ? 'Не сохранено изменений: ' + n : 'Изменений нет'),
    h('button', { class: 'b', disabled: !n, style: n ? '' : 'opacity:.5', onclick: saveAvail }, 'Сохранить')));
  return withTabs(...out);
}

async function saveAvail() {
  const jobs = Object.keys(AV.draft).map(coachId => call('availSet', { coachId, items:
    Object.keys(AV.draft[coachId]).map(date => ({ date, status: AV.draft[coachId][date] })) }));
  if (!jobs.length) return;
  app.replaceChildren(h('div', { class: 'loading' }, 'Сохранение…'));
  try { await Promise.all(jobs); AV = null; render(); toast('Сохранено'); }
  catch (e) { toast('Не всё сохранилось: ' + e.message + '. Нажмите «Сохранить» ещё раз.'); paintAvail(); }
}

async function availScreen() {
  if (!AV || AV.ym !== ST.ym) AV = { ym: ST.ym, data: null, draft: {} };
  if (!AV.data) AV.data = await call('availGet', { ym: ST.ym });
  return buildAvail(AV.data);
}

/* ---------- график (админ) ---------- */
async function schedScreen() {
  const d = await call('draftGet', { ym: ST.ym }), out = [monthHeader(() => render())];
  const run = async (action, msg) => { try { const r = await call(action, { ym: ST.ym }); if (r && r.warnings && r.warnings.length) toast(r.warnings.join('\n')); if (r && r.uncovered) toast('Без тренеров: ' + r.uncovered + ' дат(ы)'); render(); } catch (e) { toast(e.message); } };
  if (d.missing.length) out.push(h('div', { class: 'pad' }, h('b', {}, '⚠️ Не заполнили доступность: '), d.missing.join(', ')));
  d.pending.forEach(p => out.push(h('div', { class: 'row' }, h('span', { class: 'grow' }, coach(p.id).name + ' · ' + dmy(p.date) + ': ' + (p.from || '—') + ' → ' + p.to),
    btn('✓', async () => { await call('availResolve', { date: p.date, id: p.id, approve: true }); render(); }, 's'), btn('✕', async () => { await call('availResolve', { date: p.date, id: p.id, approve: false }); render(); }, 's'))));
  out.push(h('div', { class: 'pad', style: 'display:flex;gap:8px;flex-wrap:wrap' }, btn('Сгенерировать', () => run('draftGenerate')), btn('Из опубликованного', () => run('draftFromPublished'), 's'), btn('Опубликовать', () => run('publish'))));
  if (!d.exists) out.push(h('div', { class: 'pad hint' }, 'Проекта на этот месяц нет.'));
  d.dates.forEach(x => out.push(h('div', { class: 'row click', onclick: () => go(() => editDraft(x)) }, h('span', { class: 'grow' }, DOW[dowOf(x.date)] + ' ' + dmy(x.date)),
    x.cancelled ? h('span', { class: 'hint' }, 'отмена') : x.ids.map(id => h('span', { class: 'chip', style: '--coach-color:' + coach(id).color + ';margin:0' }, coach(id).name)))));
  out.push(h('div', { class: 'pad hint' }, 'Нагрузка в проекте: ' + ST.coaches.map(c => c.name + ' ' + (d.load[c.id] || 0)).join(' · ')));
  return withTabs(...out);
}
async function editDraft(x) {
  let sel = new Set(x.ids), canc = x.cancelled;
  const boxes = ST.coaches.map(c => h('div', { class: 'row' }, h('span', { class: 'dot', style: 'background:' + c.color }, c.name[0]), h('span', { class: 'grow' }, c.name),
    h('input', { type: 'checkbox', checked: sel.has(c.id), onchange: ev => { if (ev.target.checked) sel.add(c.id); else sel.delete(c.id); } })));
  return [h('div', { class: 'pad' }, h('h2', {}, DOW[dowOf(x.date)] + ' ' + dmy(x.date)), h('div', { class: 'hint' }, 'От 1 до 3 тренеров')), ...boxes,
    h('div', { class: 'row' }, h('span', { class: 'grow' }, 'Тренировка отменена'), h('input', { type: 'checkbox', checked: canc, onchange: ev => { canc = ev.target.checked; } })),
    h('div', { class: 'pad' }, btn('Сохранить в проект', async () => { try { await call('draftSet', { date: x.date, ids: [...sel], cancelled: canc }); back(); } catch (e) { toast(e.message); } }))];
}

/* ---------- отчёт ---------- */
async function reportScreen() {
  const d = await call('report', { ym: ST.ym });
  return withTabs(monthHeader(() => render()), h('div', { class: 'pad' }, h('table', {}, h('tr', {}, h('th', {}, 'Тренер'), h('th', {}, 'План'), h('th', {}, 'Факт'), h('th', {}, 'Год')),
    d.rows.map(r => h('tr', {}, h('td', {}, r.name), h('td', {}, r.plan), h('td', {}, r.fact), h('td', {}, r.year))))));
}

const SCREENS = { cal: calendar, avail: availScreen, event: eventsScreen, sched: schedScreen, report: reportScreen };
(async () => {
  try { const i = await call('init'); ST.user = i.user; ST.coaches = i.coaches; ST.today = i.today; ST.ym = i.today.slice(0, 7); setTab('cal'); }
  catch (e) { app.replaceChildren(h('div', { class: 'err' }, e.message)); }
})();
</script></body></html>
